services:
  db:
    image: postgres:16-alpine
    container_name: yademoon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yademoon}
      POSTGRES_USER: ${POSTGRES_USER:-yademoon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yademoon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - yademoon_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yademoon_pg:
